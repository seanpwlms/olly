{% if findings %}
{% for f in findings %}
<tr>
    <td>{{ f.check_type }}</td>
    <td><span class="badge badge-{{ f.severity }}">{{ f.severity }}</span></td>
    <td><a href="/table/{{ f.schema_name }}/{{ f.table_name }}">{{ f.schema_name }}.{{ f.table_name }}</a></td>
    <td>{{ f.description }}</td>
</tr>
{% endfor %}
{% else %}
<tr><td colspan="4" class="empty-state">No findings</td></tr>
{% endif %}
