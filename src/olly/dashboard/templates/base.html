<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Olly Dashboard{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <nav>
            <a href="/" class="logo">olly</a>
            <a href="/findings" class="nav-link">Findings</a>
            <a href="/history" class="nav-link">History</a>
            <a href="/tables" class="nav-link">Tables</a>
            <a href="/usage" class="nav-link">Usage</a>
            <a href="/dbt" class="nav-link">dbt</a>
            {% if connections|length > 1 %}
            <select name="connection"
                    hx-get="{{ request.url.path }}"
                    hx-include="[name='connection']"
                    hx-target="body"
                    class="connection-select">
                {% for conn in connections %}
                <option value="{{ conn }}" {% if conn == current_connection %}selected{% endif %}>
                    {{ conn }}
                </option>
                {% endfor %}
            </select>
            {% endif %}
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
