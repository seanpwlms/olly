{% extends "base.html" %}
{% block title %}Tables — Olly{% endblock %}
{% block content %}
<div class="table-header">
    <h1>Tables <span class="table-count">({{ total }})</span></h1>
    <input type="search" name="search" value="{{ search }}"
           placeholder="Filter tables..."
           class="filter-input"
           hx-get="/tables"
           hx-trigger="input changed delay:300ms, search"
           hx-target="#tables-container"
           hx-include=".tables-param"
           hx-push-url="true">
</div>
<input type="hidden" name="sort" value="{{ sort }}" class="tables-param" id="sort-input">
<input type="hidden" name="order" value="{{ order }}" class="tables-param" id="order-input">
<input type="hidden" name="page" value="1" class="tables-param" id="page-input">
<div id="tables-container">
    {% include "partials/tables_body.html" %}
</div>
<script>
function sortBy(col) {
    var si = document.getElementById('sort-input');
    var oi = document.getElementById('order-input');
    if (si.value === col) {
        oi.value = oi.value === 'asc' ? 'desc' : 'asc';
    } else {
        si.value = col;
        oi.value = 'asc';
    }
    document.getElementById('page-input').value = '1';
    htmx.trigger(document.querySelector('[name=search]'), 'search');
}
function goPage(p) {
    document.getElementById('page-input').value = p;
    htmx.trigger(document.querySelector('[name=search]'), 'search');
}
</script>
{% endblock %}
